# 文件职责：Compose 公共服务定义。
# 开发和生产 Compose 都复用这里的 Nuxt 构建、运行环境和健康检查。
services:
  nuxt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-prod}
        PNPM_VERSION: ${PNPM_VERSION:-11.5.2}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 15s
