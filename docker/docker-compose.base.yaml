# 【文件职责】
#   Compose 基础服务：nuxt 构建/运行、健康检查、graceful stop。
#   dev 与 prod compose 文件通过 extends/include 复用本定义。
#
# 【架构位置】
#   docker/ — Compose 栈核心。
#
# 【主要导出 / 路由】
#   service nuxt → 内部 http://nuxt:3000
#
# 【依赖关系】
#   - 依赖：docker/Dockerfile、.. 构建 context
#   - 被引用：docker-compose.yaml、docker-compose.dev.yaml
#
# 【渲染 / 数据】
#   healthcheck GET /；BUILD_ENV 默认 prod。
#
# 【边界与注意】
#   外部流量须经 gateway nginx；nuxt 不直接映射 host port（prod）。
services:
  nuxt:
    # BUILD_ENV 控制 Dockerfile 多阶段目标（prod/dev）
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-prod}
        PNPM_VERSION: ${PNPM_VERSION:-11.5.2}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
    healthcheck:
      # gateway depends_on condition: service_healthy 依赖此探活
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 15s
