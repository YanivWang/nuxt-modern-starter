# 【文件职责】
#   生产 Compose 覆盖：Nginx gateway 对外 :3000，nuxt 读 .env.prod。
#
# 【架构位置】
#   docker/ — pnpm docker:run 生产栈。
#
# 【主要导出 / 路由】
#   gateway:3000 → nuxt:3000
#
# 【依赖关系】
#   - 依赖：docker-compose.base.yaml、nginx/gateway.docker.conf、../.env.prod
#   - 被引用：部署文档、pnpm docker:run
#
# 【渲染 / 数据】
#   NODE_ENV=production，NUXT_APP_ENV=production。
#
# 【边界与注意】
#   真实密钥运行时 env_file 注入，不打进镜像。
# 文件职责：生产环境 Compose 覆盖配置。
# 通过 Nginx 网关暴露唯一外部入口，Nuxt 服务只在 Compose 网络内监听。
name: nuxt-modern-starter-prod

services:
  gateway:
    # 生产栈：gateway healthy 依赖 nuxt healthcheck
    image: nginx:alpine
    container_name: nuxt-modern-starter-gateway
    volumes:
      - ./nginx/gateway.docker.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${GATEWAY_HOST_PORT:-3000}:3000'
    depends_on:
      nuxt:
        # Nuxt 健康后再对外暴露 gateway，避免 502
        condition: service_healthy
    restart: unless-stopped

  nuxt:
    container_name: nuxt-modern-starter-nuxt
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      NUXT_APP_ENV: production
