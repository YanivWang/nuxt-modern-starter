# 【文件职责】
#   Docker 网关 Nginx：反向代理到 nuxt:3000，/_nuxt/ 可配长缓存，支持 WebSocket upgrade。
#
# 【架构位置】
#   docker/nginx — gateway 容器挂载为 /etc/nginx/nginx.conf。
#
# 【主要导出 / 路由】
#   listen 3000 → proxy_pass nuxt:3000
#
# 【依赖关系】
#   - 依赖：Compose service 名 nuxt、Docker embedded DNS
#   - 被引用：docker-compose.yaml、docker-compose.dev.yaml
#
# 【渲染 / 数据】
#   无应用逻辑；gzip 静态类型；access_log stdout。
#
# 【边界与注意】
#   生产可对 /_nuxt/ 加长 cache；TLS 终止在更外层 ingress 时需同步 X-Forwarded-*。
# 文件职责：Docker 网关 Nginx 配置。
# 把页面、静态资源和同源请求反向代理到 nuxt:3000。
worker_processes auto;

events {
    worker_connections 1024;
}

pid /tmp/nginx.pid;

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    access_log /dev/stdout;
    error_log /dev/stderr;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 3000 default_server;
        listen [::]:3000 default_server;
        server_name _;

        location /_nuxt/ {
            set $upstream_nuxt nuxt:3000;
            proxy_pass http://$upstream_nuxt$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            set $upstream_nuxt nuxt:3000;
            proxy_pass http://$upstream_nuxt$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
