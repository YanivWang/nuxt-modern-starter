# 【文件职责】
#   开发 Compose 覆盖：源码 bind mount、匿名卷 node_modules/.nuxt、gateway 代理 dev server。
#
# 【架构位置】
#   docker/ — pnpm docker:up:dev / docker:down:dev 的本地联调栈。
#     （pnpm docker:dev 不存在于本仓库；那是 nuxt-modern-starter-api 后端仓的命令）
#
# 【主要导出 / 路由】
#   gateway:3000 → nuxt dev :3000；HMR 24678 映射 host
#
# 【依赖关系】
#   - 依赖：Dockerfile.dev、../.env.dev、gateway.docker.conf
#   - 被引用：本地 Docker 开发流程
#
# 【渲染 / 数据】
#   command：pnpm install + pnpm dev --host 0.0.0.0。
#
# 【边界与注意】
#   CI=true install 避免 interactive；卷 app_node_modules 防 host 污染。
#   绑定挂载源码，并通过 Nginx 网关提供与生产接近的入口。
name: nuxt-modern-starter-dev

services:
  gateway:
    # 对外唯一入口 :3000；TLS 在更外层 ingress 终止
    image: nginx:alpine
    container_name: nuxt-modern-starter-gateway-dev
    volumes:
      - ./nginx/gateway.docker.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${GATEWAY_HOST_PORT:-3000}:3000'
    depends_on:
      nuxt:
        condition: service_healthy
    restart: unless-stopped

  nuxt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        PNPM_VERSION: ${PNPM_VERSION:-11.5.2}
    container_name: nuxt-modern-starter-nuxt-dev
    env_file:
      - ../.env.dev
    environment:
      HUSKY: '0'
      NODE_ENV: development
      NUXT_PUBLIC_APP_ENV: development
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '24678:24678'
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
      - app_nuxt:/app/.nuxt
    command: ['sh', '-c', 'CI=true pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0']

volumes:
  app_node_modules:
  app_nuxt:
