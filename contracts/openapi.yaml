  /api/v1/uploads/large/init:
    post:
      tags:
        - 上传
      summary: 创建大文件分片上传任务
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 255
                fileSize:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 1073741824
                chunkSize:
                  type: integer
                  minimum: 1048576
                  maximum: 8388608
                mimeType:
                  type: string
                  maxLength: 128
                fileMd5:
                  type: string
                  minLength: 32
                  maxLength: 32
                  pattern: ^[a-fA-F0-9]{32}$
              required:
                - fileName
                - fileSize
                - chunkSize
                - fileMd5
      responses:
        "200":
          description: 创建上传任务；MD5 命中时 instant 为 true 并直接返回 publicUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LargeUploadInitResultBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: 未登录、登录已过期或凭证无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
