openapi: 3.1.0
info:
  title: Nuxt Modern Starter API
  version: 1.0.0
  description: >-
    独立 Express API 服务脚手架，覆盖健康探针、认证、当前用户与资料、公开内容（新闻/定价）、项目、文档、普通图片上传与大文件分片上传。 所有业务接口都在 /api/v1 前缀下。无版本的 /api
    别名已下线，破坏性变更只通过抬版本号发布。
servers:
  - url: http://127.0.0.1:3000
    description: 本地 API 服务
  - url: http://127.0.0.1:2027
    description: Docker Nginx 网关
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pagination:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        offset:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        hasMore:
          type: boolean
      required:
        - total
        - limit
        - offset
        - hasMore
      additionalProperties: false
    ProjectDto:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        documentId:
          anyOf:
            - type: string
            - type: "null"
        title:
          type: string
        description:
          anyOf:
            - type: string
            - type: "null"
        status:
          type: string
          enum:
            - draft
            - published
            - archived
        slideCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        accent:
          type: string
          enum:
            - blue
            - green
            - violet
            - amber
            - cyan
            - rose
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - documentId
        - title
        - description
        - status
        - slideCount
        - accent
        - updatedAt
      additionalProperties: false
    DocumentDto:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        content:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectId
        - title
        - content
        - updatedAt
      additionalProperties: false
    AuthTokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        refreshTokenExpiresIn:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresIn
        - refreshTokenExpiresIn
      additionalProperties: false
    PublicUser:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        username:
          type: string
        avatar:
          anyOf:
            - type: string
            - type: "null"
        nickname:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - username
        - avatar
        - nickname
      additionalProperties: false
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        userId:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        nickname:
          anyOf:
            - type: string
            - type: "null"
        avatar:
          anyOf:
            - type: string
            - type: "null"
        gender:
          anyOf:
            - type: string
            - type: "null"
        birthday:
          anyOf:
            - type: string
            - type: "null"
        bio:
          anyOf:
            - type: string
            - type: "null"
        address:
          anyOf:
            - type: string
            - type: "null"
        company:
          anyOf:
            - type: string
            - type: "null"
        jobTitle:
          anyOf:
            - type: string
            - type: "null"
        isMarried:
          anyOf:
            - type: boolean
            - type: "null"
        mom:
          anyOf:
            - type: string
            - type: "null"
        father:
          anyOf:
            - type: string
            - type: "null"
        university:
          anyOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - nickname
        - avatar
        - gender
        - birthday
        - bio
        - address
        - company
        - jobTitle
        - isMarried
        - mom
        - father
        - university
        - createdAt
        - updatedAt
      additionalProperties: false
    NewsArticleSource:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: object
          properties:
            zh-CN:
              type: string
              minLength: 1
            en-US:
              type: string
              minLength: 1
          required:
            - zh-CN
            - en-US
          additionalProperties: false
        description:
          type: object
          properties:
            zh-CN:
              type: string
              minLength: 1
            en-US:
              type: string
              minLength: 1
          required:
            - zh-CN
            - en-US
          additionalProperties: false
        body:
          type: object
          properties:
            zh-CN:
              minItems: 1
              type: array
              items:
                type: string
                minLength: 1
            en-US:
              minItems: 1
              type: array
              items:
                type: string
                minLength: 1
          required:
            - zh-CN
            - en-US
          additionalProperties: false
        publishedAt:
          type: string
          minLength: 1
      required:
        - slug
        - title
        - description
        - body
        - publishedAt
      additionalProperties: false
    LocalizedNewsSummary:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        publishedAt:
          type: string
      required:
        - slug
        - title
        - description
        - publishedAt
      additionalProperties: false
    LocalizedNewsArticle:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        publishedAt:
          type: string
        body:
          type: array
          items:
            type: string
      required:
        - slug
        - title
        - description
        - publishedAt
        - body
      additionalProperties: false
    LocalizedPricingPlan:
      type: object
      properties:
        key:
          type: string
          enum:
            - starter
            - growth
            - custom
        featured:
          type: boolean
        ctaPath:
          type: string
          enum:
            - /sign-up
            - /help
        name:
          type: string
        badge:
          type: string
        price:
          type: string
        period:
          type: string
        description:
          type: string
        cta:
          type: string
        features:
          type: array
          items:
            type: string
      required:
        - key
        - featured
        - ctaPath
        - name
        - badge
        - price
        - period
        - description
        - cta
        - features
      additionalProperties: false
    LocalizedPricingPage:
      type: object
      properties:
        eyebrow:
          type: string
        title:
          type: string
        lead:
          type: string
        note:
          type: string
        plans:
          type: array
          items:
            $ref: "#/components/schemas/LocalizedPricingPlan"
        includes:
          type: object
          properties:
            eyebrow:
              type: string
            title:
              type: string
            items:
              type: array
              items:
                type: string
          required:
            - eyebrow
            - title
            - items
          additionalProperties: false
      required:
        - eyebrow
        - title
        - lead
        - note
        - plans
        - includes
      additionalProperties: false
    ImageUploadResult:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
      required:
        - urls
      additionalProperties: false
    LargeUploadInitResult:
      oneOf:
        - type: object
          properties:
            instant:
              type: boolean
              const: true
            publicUrl:
              type: string
            chunkTotal:
              type: number
              const: 0
            expiresAt:
              type: string
          required:
            - instant
            - publicUrl
            - chunkTotal
            - expiresAt
          additionalProperties: false
        - type: object
          properties:
            instant:
              type: boolean
              const: false
            uploadId:
              type: string
            chunkTotal:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            expiresAt:
              type: string
          required:
            - instant
            - uploadId
            - chunkTotal
            - expiresAt
          additionalProperties: false
    LargeUploadStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - uploading
            - merging
            - done
            - failed
        chunkTotal:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        receivedIndices:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        publicUrl:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        chunkSize:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - status
        - chunkTotal
        - receivedIndices
      additionalProperties: false
    LargeUploadMergeResult:
      type: object
      properties:
        url:
          type: string
        merged:
          type: boolean
      required:
        - url
        - merged
      additionalProperties: false
    ChunkAccepted:
      type: object
      properties:
        chunkIndex:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - chunkIndex
      additionalProperties: false
    EmptyData:
      type: object
      properties: {}
      additionalProperties: false
    ErrorBody:
      type: object
      properties:
        code:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        message:
          type: string
        data:
          type: "null"
      required:
        - code
        - message
        - data
      additionalProperties: false
    NullDataBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: "null"
      required:
        - code
        - message
        - data
      additionalProperties: false
    AuthTokenPairBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthTokenPair"
      required:
        - code
        - message
        - data
      additionalProperties: false
    MeBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/PublicUser"
          required:
            - user
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    ProfileBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            profile:
              anyOf:
                - $ref: "#/components/schemas/UserProfile"
                - type: "null"
          required:
            - profile
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    UpdatedProfileBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            profile:
              $ref: "#/components/schemas/UserProfile"
          required:
            - profile
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    NewsListBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            articles:
              type: array
              items:
                $ref: "#/components/schemas/LocalizedNewsSummary"
            pagination:
              $ref: "#/components/schemas/Pagination"
          required:
            - articles
            - pagination
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    NewsArticleBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            article:
              $ref: "#/components/schemas/LocalizedNewsArticle"
          required:
            - article
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    NewsSourceBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            article:
              $ref: "#/components/schemas/NewsArticleSource"
          required:
            - article
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    PricingBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            pricing:
              $ref: "#/components/schemas/LocalizedPricingPage"
          required:
            - pricing
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    ProjectListBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            projects:
              type: array
              items:
                $ref: "#/components/schemas/ProjectDto"
            pagination:
              $ref: "#/components/schemas/Pagination"
          required:
            - projects
            - pagination
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    ProjectBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            project:
              $ref: "#/components/schemas/ProjectDto"
          required:
            - project
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    ProjectCreatedBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            project:
              $ref: "#/components/schemas/ProjectDto"
            document:
              $ref: "#/components/schemas/DocumentDto"
          required:
            - project
            - document
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    DocumentBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          type: object
          properties:
            document:
              $ref: "#/components/schemas/DocumentDto"
          required:
            - document
          additionalProperties: false
      required:
        - code
        - message
        - data
      additionalProperties: false
    ImageUploadBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          $ref: "#/components/schemas/ImageUploadResult"
      required:
        - code
        - message
        - data
      additionalProperties: false
    LargeUploadInitResultBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          $ref: "#/components/schemas/LargeUploadInitResult"
      required:
        - code
        - message
        - data
      additionalProperties: false
    LargeUploadStatusBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          $ref: "#/components/schemas/LargeUploadStatus"
      required:
        - code
        - message
        - data
      additionalProperties: false
    LargeUploadMergeBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          $ref: "#/components/schemas/LargeUploadMergeResult"
      required:
        - code
        - message
        - data
      additionalProperties: false
    ChunkAcceptedBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          $ref: "#/components/schemas/ChunkAccepted"
      required:
        - code
        - message
        - data
      additionalProperties: false
    EmptyDataBody:
      type: object
      properties:
        code:
          type: number
          const: 200
        message:
          type: string
        data:
          $ref: "#/components/schemas/EmptyData"
      required:
        - code
        - message
        - data
      additionalProperties: false
    HealthBody:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    ReadyChecks:
      type: object
      properties:
        mysql:
          type: string
          enum:
            - ok
            - failed
        redis:
          type: string
          enum:
            - ok
            - failed
            - disabled
      required:
        - mysql
        - redis
      additionalProperties: false
    ReadyBody:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          $ref: "#/components/schemas/ReadyChecks"
        message:
          type: string
      required:
        - status
        - checks
      additionalProperties: false
paths:
  /health:
    get:
      tags:
        - 探针
      summary: 存活探针
      responses:
        "200":
          description: 进程存活；不访问 MySQL/Redis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthBody"
  /ready:
    get:
      tags:
        - 探针
      summary: 就绪探针
      responses:
        "200":
          description: 依赖就绪；关闭黑名单时 redis 为 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyBody"
        "503":
          description: 依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyBody"
  /api/v1/register:
    post:
      tags:
        - 认证
      summary: 注册用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 2
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
              required:
                - username
                - password
      responses:
        "200":
          description: 注册成功；不自动登录，data 为 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: 与现有资源状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 2
                  maxLength: 100
                password:
                  type: string
                  minLength: 1
              required:
                - username
                - password
      responses:
        "200":
          description: 登录成功，返回 accessToken、refreshToken，并写入 httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenPairBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: 未登录、登录已过期或凭证无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/refresh:
    post:
      tags:
        - 认证
      summary: 刷新 access token 并轮换 refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: 刷新成功，返回新的 accessToken、refreshToken，并写入 httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenPairBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: 未登录、登录已过期或凭证无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: CSRF 校验失败、访问了不属于自己的资源，或角色权限不足（内容写接口要求管理员）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/logout:
    post:
      tags:
        - 认证
      summary: 退出登录
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: 退出登录成功，data 为 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: 未登录、登录已过期或凭证无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
