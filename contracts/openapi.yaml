openapi: 3.1.0
info:
  title: Nuxt Modern Starter API
  version: 1.0.0
  description: >-
    独立 Express API 服务脚手架，覆盖健康探针、认证、当前用户与资料、公开内容（新闻/定价）、项目、文档、普通图片上传与大文件分片上传。 所有业务接口都在 /api/v1 前缀下。无版本的 /api
    别名已下线，破坏性变更只通过抬版本号发布。
servers:
  - url: http://127.0.0.1:3000
    description: 本地 API 服务
  - url: http://127.0.0.1:2027
    description: Docker Nginx 网关
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessBody:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
      required:
        - code
        - message
        - data
      additionalProperties: false
    ErrorBody:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: "null"
      required:
        - code
        - message
        - data
      additionalProperties: false
    HealthBody:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    ReadyChecks:
      type: object
      properties:
        mysql:
          type: string
          enum:
            - ok
            - failed
        redis:
          type: string
          enum:
            - ok
            - failed
            - disabled
      required:
        - mysql
        - redis
      additionalProperties: false
    ReadyBody:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          $ref: "#/components/schemas/ReadyChecks"
        message:
          type: string
      required:
        - status
        - checks
      additionalProperties: false
paths:
  /health:
    get:
      tags:
        - 探针
      summary: 存活探针
      responses:
        "200":
          description: 进程存活；不访问 MySQL/Redis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthBody"
  /ready:
    get:
      tags:
        - 探针
      summary: 就绪探针
      responses:
        "200":
          description: 依赖就绪；关闭黑名单时 redis 为 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyBody"
        "503":
          description: 依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyBody"
  /api/v1/register:
    post:
      tags:
        - 认证
      summary: 注册用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 2
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
              required:
                - username
                - password
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 2
                  maxLength: 100
                password:
                  type: string
                  minLength: 1
              required:
                - username
                - password
      responses:
        "200":
          description: 登录成功，返回 accessToken、refreshToken，并写入 httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/refresh:
    post:
      tags:
        - 认证
      summary: 刷新 access token 并轮换 refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: 刷新成功，返回新的 accessToken、refreshToken，并写入 httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/logout:
    post:
      tags:
        - 认证
      summary: 退出登录
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: 退出登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/me:
    get:
      tags:
        - 当前用户
      summary: 获取当前用户
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户基础资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/me/profile:
    get:
      tags:
        - 当前用户
      summary: 获取当前用户扩展资料
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户扩展资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags:
        - 当前用户
      summary: 更新当前用户扩展资料
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 100
                avatar:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 500
                gender:
                  anyOf:
                    - type: "null"
                    - type: string
                      enum:
                        - male
                        - female
                        - unknown
                birthday:
                  anyOf:
                    - type: "null"
                    - type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                bio:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 65535
                address:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 255
                company:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 255
                jobTitle:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 255
                isMarried:
                  anyOf:
                    - type: boolean
                    - type: "null"
                mom:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 255
                father:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 255
                university:
                  anyOf:
                    - type: "null"
                    - type: string
                      maxLength: 255
              additionalProperties: false
      responses:
        "200":
          description: 更新当前用户扩展资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/content/news:
    get:
      tags:
        - 公开内容
      summary: 获取新闻列表
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum:
              - zh-CN
              - en-US
      responses:
        "200":
          description: 本地化新闻列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags:
        - 公开内容
      summary: 创建新闻
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  minLength: 1
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                title:
                  type: object
                  properties:
                    zh-CN:
                      type: string
                      minLength: 1
                    en-US:
                      type: string
                      minLength: 1
                  required:
                    - zh-CN
                    - en-US
                description:
                  type: object
                  properties:
                    zh-CN:
                      type: string
                      minLength: 1
                    en-US:
                      type: string
                      minLength: 1
                  required:
                    - zh-CN
                    - en-US
                body:
                  type: object
                  properties:
                    zh-CN:
                      minItems: 1
                      type: array
                      items:
                        type: string
                        minLength: 1
                    en-US:
                      minItems: 1
                      type: array
                      items:
                        type: string
                        minLength: 1
                  required:
                    - zh-CN
                    - en-US
                publishedAt:
                  type: string
                  minLength: 1
              required:
                - slug
                - title
                - description
                - body
                - publishedAt
      responses:
        "200":
          description: 创建新闻
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/content/pricing:
    get:
      tags:
        - 公开内容
      summary: 获取定价页内容
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum:
              - zh-CN
              - en-US
      responses:
        "200":
          description: 本地化定价页内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/content/news/{slug}:
    get:
      tags:
        - 公开内容
      summary: 获取新闻详情
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum:
              - zh-CN
              - en-US
      responses:
        "200":
          description: 本地化新闻详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags:
        - 公开内容
      summary: 更新新闻
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: object
                  properties:
                    zh-CN:
                      type: string
                      minLength: 1
                    en-US:
                      type: string
                      minLength: 1
                  required:
                    - zh-CN
                    - en-US
                description:
                  type: object
                  properties:
                    zh-CN:
                      type: string
                      minLength: 1
                    en-US:
                      type: string
                      minLength: 1
                  required:
                    - zh-CN
                    - en-US
                body:
                  type: object
                  properties:
                    zh-CN:
                      minItems: 1
                      type: array
                      items:
                        type: string
                        minLength: 1
                    en-US:
                      minItems: 1
                      type: array
                      items:
                        type: string
                        minLength: 1
                  required:
                    - zh-CN
                    - en-US
                publishedAt:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: 更新新闻
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      tags:
        - 公开内容
      summary: 删除新闻
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      responses:
        "200":
          description: 删除新闻
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/projects:
    get:
      tags:
        - 项目
      summary: 获取当前用户项目列表（分页）
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 单页条数，默认 20，最大 100
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          description: 起始偏移量，默认 0
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: 当前用户项目列表，data 含 projects 与 pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags:
        - 项目
      summary: 创建项目并初始化文档
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 160
                description:
                  type: string
                  maxLength: 500
              required:
                - title
      responses:
        "200":
          description: 创建项目成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/projects/{projectId}:
    get:
      tags:
        - 项目
      summary: 获取当前用户项目详情
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags:
        - 项目
      summary: 更新当前用户项目
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 160
                description:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: 更新项目成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessBody"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 触发限流或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      tags:
        - 项目
      summary: 删除当前用户项目
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
