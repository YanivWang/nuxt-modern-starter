  /api/v1/uploads/large/{uploadId}/chunks/{chunkIndex}:
    put:
      tags:
        - 上传
      summary: 上传大文件分片
      security:
        - bearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
