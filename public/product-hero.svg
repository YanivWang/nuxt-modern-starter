              <path d="M5 8 L7 10 L12 5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="26" y="12" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">hreflang routes</text>
