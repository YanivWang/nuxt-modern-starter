<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Nuxt Modern Starter platform preview</title>
  <desc id="desc">A polished SaaS dashboard mockup showing multilingual routes, SEO metrics, deployment status, and public site modules.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#1677ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1677ff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="124%">
